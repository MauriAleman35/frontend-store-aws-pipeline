<div class="catalog-layout">
  <header class="catalog-header">
    <div class="catalog-header__brand">
      <div class="catalog-header__title-row">
        <h1 class="catalog-header__title">NovaStore</h1>

      </div>
      <p class="catalog-header__subtitle">Productos seleccionados para tu día a día</p>
    </div>
  </header>

  <main class="catalog-main">
    <section class="catalog-summary-section" aria-label="Resumen del catálogo">
      <app-catalog-summary [summary]="summary()" />
    </section>

    <section class="catalog-products-section" aria-label="Listado de productos">
      <div class="catalog-products-section__header">
        <h2 class="catalog-products-section__title">Nuestros Productos</h2>
        <span class="catalog-products-section__counter">{{ products().length }} artículos en catálogo</span>
      </div>

      @if (products().length > 0) {
        <div class="catalog-grid" data-testid="catalog-grid">
          @for (item of products(); track item.id) {
            <app-product-card [product]="item" />
          }
        </div>
      } @else {
        <app-empty-state
          title="No hay productos disponibles"
          message="No existen productos cargados en el catálogo en este momento."
          data-testid="catalog-empty-state"
        />
      }
    </section>
  </main>
</div>
